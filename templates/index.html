
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Inteligente</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #11120D;
            color: #FFFBF4;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 24px 8%;
            background-color: #565449;
        }

        header h1 {
            margin: 0;
            color: #FFFBF4;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 24px;
            text-align: center;
        }

        main h2 {
            color: #D8CFBC;
            font-size: 36px;
        }

        main p {
            font-size: 18px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border: 1px solid #D8CFBC;
            border-radius: 8px;
            color: #D8CFBC;
        }
    </style>
</head>

<body>
    <header>
        <h1>Biblioteca Inteligente</h1>
    </header>

    <main>
        <h2>Seja bem-vindo!</h2>

        <p>
            Organize livros, autores, alunos e empréstimos
            em um só lugar.
        </p>

        <div class="status">
            Sistema iniciado com sucesso!
        </div>
    </main>
</body>
</html>
