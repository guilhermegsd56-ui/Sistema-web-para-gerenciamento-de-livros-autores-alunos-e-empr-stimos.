<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar aluno | Biblioteca Inteligente</title>

    <style>
        :root {
            --preto: #11120D;
            --cinza: #565449;
            --bege: #D8CFBC;
            --branco: #FFFBF4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 35px 5%;
            background: var(--preto);
            color: var(--branco);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 30px;
            border: 1px solid var(--cinza);
            border-radius: 14px;
            background: #1b1c16;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--bege);
        }

        .descricao {
            margin-bottom: 28px;
            color: var(--bege);
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--cinza);
            border-radius: 8px;
            background: var(--preto);
            color: var(--branco);
            font-size: 15px;
        }

        input:focus {
            outline: 1px solid var(--bege);
        }

        .mensagem {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: var(--cinza);
        }

        .botoes {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            padding: 12px 18px;
            border: 1px solid var(--bege);
            border-radius: 8px;
            background: var(--bege);
            color: var(--preto);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .secundario {
            background: transparent;
            color: var(--branco);
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Editar aluno</h1>

        <p class="descricao">
            Atualize os dados do aluno abaixo.
            A idade será recalculada automaticamente.
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="mensagem" role="alert">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        <form
            method="POST"
            action="{{ url_for(
                'editar_aluno',
                id_aluno=aluno.ID_ALUNO
            ) }}">

            <div class="campo">
                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    maxlength="45"
                    value="{{ aluno.NOME }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="data_nascimento">
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    max="{{ hoje }}"
                    value="{% if aluno.DATA_NASCIMENTO and aluno.DATA_NASCIMENTO.strftime is defined %}{{ aluno.DATA_NASCIMENTO.strftime('%Y-%m-%d') }}{% else %}{{ aluno.DATA_NASCIMENTO }}{% endif %}"
                    required
                >
            </div>

            <div class="botoes">
                <button class="botao" type="submit">
                    Salvar alterações
                </button>

                <a
                    class="botao secundario"
                    href="{{ url_for('listar_alunos') }}">
                    Cancelar
                </a>
            </div>
        </form>
    </main>
</body>
</html>
