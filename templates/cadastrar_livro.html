
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar livro | Biblioteca Inteligente</title>

    <style>
        :root {
            --fundo: #11120D;
            --secundaria: #565449;
            --detalhe: #D8CFBC;
            --texto: #FFFBF4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: var(--fundo);
            color: var(--texto);
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 650px;
            margin: auto;
        }

        a {
            color: var(--detalhe);
            text-decoration: none;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 28px;
        }

        h1 {
            color: var(--detalhe);
        }

        .descricao {
            color: #c5c2b8;
            margin-bottom: 28px;
        }

        .mensagem {
            padding: 12px;
            border-radius: 8px;
            background: #492626;
            color: #ffdddd;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--secundaria);
            border-radius: 8px;
            background: #1b1c16;
            color: var(--texto);
            font-size: 15px;
        }

        input:focus {
            outline: 1px solid var(--detalhe);
        }

        button {
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--detalhe);
            color: var(--fundo);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <main>
        <a class="voltar" href="{{ url_for('listar_livros') }}">
            ← Voltar ao acervo
        </a>

        <h1>Cadastrar livro</h1>

        <p class="descricao">
            Preencha os dados para adicionar uma obra ao acervo.
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p class="mensagem">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('cadastrar_livro') }}">

            <label for="titulo">Título *</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                maxlength="45"
                required
                value="{{ titulo|default('') }}"
                placeholder="Ex.: Dom Casmurro"
            >

            <label for="ano_publicacao">Data de publicação *</label>
            <input
                type="date"
                id="ano_publicacao"
                name="ano_publicacao"
                required
                value="{{ ano_publicacao|default('') }}"
            >

            <label for="autor">Autor</label>
            <input
                type="text"
                id="autor"
                name="autor"
                maxlength="45"
                value="{{ autor|default('') }}"
                placeholder="Ex.: Machado de Assis"
            >

            <button type="submit">Salvar livro</button>
        </form>
    </main>
</body>
</html>
